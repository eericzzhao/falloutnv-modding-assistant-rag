[pytest]
# Must be run from the repo root: backend.main does `from backend.services import ...`,
# and services.py does a flat `import s3_utils`, so the repo root is the package root.
testpaths = tests
# --disable-socket makes the offline guarantee enforced rather than conventional: any
# test that reaches for Qdrant, Gemini, HF Hub, or AWS fails instead of quietly passing
# on a dev machine with credentials. Unix sockets stay allowed for asyncio's self-pipe.
addopts = -ra --disable-socket --allow-unix-socket
