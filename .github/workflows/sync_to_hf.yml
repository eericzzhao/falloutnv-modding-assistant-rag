name: Sync to Hugging Face Space

on:
  push:
    branches: [master] # Or 'master', depending on your default branch

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          lfs: true # downloads the actual LFS files (e.g. chunks.pkl)

      # archived/ contains legacy reference files (old app.py, screenshots) that
      # aren't needed to run the backend, and include PNGs that were never LFS-tracked
      # -- pushing full history including them gets rejected by HF's binary-file policy.
      # Pushing a single filtered snapshot instead sidesteps that without rewriting
      # real git history on origin/master.
      - name: Build filtered snapshot (excludes archived/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan hf-deploy
          git rm -r --cached archived/ > /dev/null 2>&1 || true
          rm -rf archived/
          # stamp the deployed commit so /api/v1/health reports which code is live;
          # the orphan snapshot's own SHA is not the master SHA, so it can't be used
          echo "${{ github.sha }}" > VERSION
          git add -A
          git commit -m "Sync to Hugging Face Space"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://eericzzhao:$HF_TOKEN@huggingface.co/spaces/eericzzhao/fnv-rag-backend hf-deploy:main