name: Automated Knowledge Base Ingestion

on:
  schedule:
    # runs at 00:00 every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # allows to manually click "Run Workflow" on github

jobs:
  update-vector-db:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' #speeds up consecutive runs
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Nexus Mods Ingestion Script
        run: python build_pipeline_NM.py
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          # mod_queue.txt, processed_mods.txt, and chunks.pkl are now synced to S3
          # by build_pipeline_NM.py directly, so no commit-back-to-repo step is needed here